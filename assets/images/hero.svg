<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 880" role="img" aria-label="Elegant beauty flat lay with perfume, serum and lipstick">
  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8F0E6"/><stop offset="0.55" stop-color="#F2E4D6"/><stop offset="1" stop-color="#E7D6C2"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D9B98A"/><stop offset="0.5" stop-color="#F0DCB8"/><stop offset="1" stop-color="#C29E6B"/>
    </linearGradient>
    <linearGradient id="serum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B4762B"/><stop offset="0.5" stop-color="#DFA34F"/><stop offset="1" stop-color="#9C6320"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.75"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="880" fill="url(#heroBg)"/>
  <circle cx="400" cy="330" r="300" fill="url(#glow)"/>
  <circle cx="150" cy="180" r="120" fill="#FFFFFF" opacity="0.35"/>
  <circle cx="660" cy="700" r="150" fill="#C98F86" opacity="0.12"/>
  <ellipse cx="400" cy="762" rx="300" ry="34" fill="#1B1A18" opacity="0.08"/>

  <!-- perfume flacon -->
  <g transform="translate(300 380)">
    <rect x="70" y="-130" width="60" height="56" rx="10" fill="#2A2724"/>
    <rect x="84" y="-76" width="32" height="24" fill="#A98A54"/>
    <path d="M20 -50 h160 q20 0 20 22 l16 300 q0 26 -26 26 h-180 q-26 0 -26 -26 l16 -300 q0 -22 20 -22 Z" fill="url(#glass)" stroke="#A5835A" stroke-width="3"/>
    <rect x="42" y="-14" width="20" height="270" rx="10" fill="#FFFFFF" opacity="0.45"/>
    <rect x="30" y="150" width="140" height="70" rx="8" fill="#FFFFFF" opacity="0.55"/>
    <rect x="56" y="172" width="88" height="10" rx="5" fill="#8A6E45" opacity="0.7"/>
    <rect x="74" y="194" width="52" height="8" rx="4" fill="#8B867E" opacity="0.55"/>
  </g>

  <!-- serum dropper -->
  <g transform="translate(120 470)">
    <rect x="34" y="-120" width="44" height="58" rx="10" fill="#2A2724"/>
    <rect x="46" y="-64" width="20" height="16" fill="#4A443D"/>
    <rect x="42" y="-50" width="28" height="86" rx="4" fill="#7FB3BF" opacity="0.7"/>
    <rect x="10" y="34" width="92" height="250" rx="18" fill="url(#serum)" stroke="#8A5A1C" stroke-width="2.5"/>
    <rect x="26" y="58" width="12" height="200" rx="6" fill="#FFFFFF" opacity="0.35"/>
    <rect x="10" y="130" width="92" height="70" fill="#FBF3E4" opacity="0.85"/>
  </g>

  <!-- lipstick -->
  <g transform="translate(560 500)">
    <rect x="0" y="60" width="72" height="200" rx="9" fill="#2A2724"/>
    <rect x="0" y="60" width="72" height="14" rx="7" fill="#A98A54" opacity="0.85"/>
    <path d="M12 60 L12 -30 Q12 -54 36 -64 Q60 -54 60 -30 L60 60 Z" fill="#A24B58"/>
    <path d="M36 -64 L60 -30 L60 60 L50 60 L50 -26 Z" fill="#FFFFFF" opacity="0.14"/>
  </g>

  <!-- leaves / accents -->
  <path d="M90 700 q60 -80 150 -70 q-40 90 -150 70 Z" fill="#6F8268" opacity="0.35"/>
  <path d="M710 250 q-70 -60 -150 -40 q50 80 150 40 Z" fill="#6F8268" opacity="0.28"/>
  <g fill="#C98F86" opacity="0.5">
    <circle cx="640" cy="180" r="10"/><circle cx="672" cy="208" r="6"/><circle cx="150" cy="640" r="8"/>
  </g>
  <text x="400" y="850" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" letter-spacing="12" fill="#8B867E">MAVELIQ</text>
</svg>
